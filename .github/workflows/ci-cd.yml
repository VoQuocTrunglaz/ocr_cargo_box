name: Test Deploy Private

on:
  push:
    branches:
      - main

jobs:
  deploy_private:
    name: 🚀 Triển khai lên EC2 Private qua EC2 Public
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Lấy code từ GitHub
        uses: actions/checkout@v4

      - name: 🔑 Thiết lập SSH key cho cả Public và Private
        run: |
          mkdir -p ~/.ssh

          # Ghi key cho EC2 Public
          echo "🔍 Ghi key cho EC2 Public"
          [ -z "${{ secrets.AWS_PUBLIC_KEY }}" ] && echo "❌ AWS_PUBLIC_KEY rỗng" && exit 1 || echo "✅ AWS_PUBLIC_KEY tồn tại"
          echo "${{ secrets.AWS_PUBLIC_KEY }}" > ~/.ssh/aws_public_key.pem
          chmod 600 ~/.ssh/aws_public_key.pem

          # Ghi key cho EC2 Private (nếu khác key public)
          echo "🔍 Ghi key cho EC2 Private"
          [ -z "${{ secrets.AWS_PRIVATE_KEY }}" ] && echo "❌ AWS_PRIVATE_KEY rỗng" && exit 1 || echo "✅ AWS_PRIVATE_KEY tồn tại"
          echo "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/aws_private_key.pem
          chmod 600 ~/.ssh/aws_private_key.pem

          # Scan EC2 Public host
          echo "🔍 Scan Public host: ${{ secrets.AWS_PUBLIC_HOST }}"
          ssh-keyscan -H ${{ secrets.AWS_PUBLIC_HOST }} >> ~/.ssh/known_hosts || { echo "⚠️ Không thể scan Public host, lỗi: $?"; exit 1; }

          # Scan EC2 Private host thông qua ProxyCommand
          echo "🔍 Scan Private host qua proxy"
          ssh-keyscan -o ProxyCommand="ssh -i ~/.ssh/aws_public_key.pem -W %h:%p ubuntu@${{ secrets.AWS_PUBLIC_HOST }}" ${{ secrets.AWS_PRIVATE_HOST }} >> ~/.ssh/known_hosts || { echo "⚠️ Không thể scan Private host, lỗi: $?"; exit 1; }

          echo "✅ Đã thiết lập SSH keys và known_hosts"

      - name: 🔠 Chuyển đổi tên repository thành chữ thường
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🔍 Kiểm tra kết nối SSH đến EC2 Private qua Public
        run: |
          ssh -tt -i ~/.ssh/aws_public_key.pem \
            -o ProxyCommand="ssh -i ~/.ssh/aws_public_key.pem -W %h:%p ubuntu@${{ secrets.AWS_PUBLIC_HOST }}" \
            ubuntu@${{ secrets.AWS_PRIVATE_HOST }} << 'EOF'
            echo "✅ Kết nối SSH đến EC2 Private thành công"
            whoami
            hostname
          EOF

      - name: 🛠️ Cài đặt Docker trên EC2 Private qua Public
        run: |
          ssh -tt -i ~/.ssh/aws_public_key.pem \
            -o ProxyCommand="ssh -i ~/.ssh/aws_public_key.pem -W %h:%p ubuntu@${{ secrets.AWS_PUBLIC_HOST }}" \
            ubuntu@${{ secrets.AWS_PRIVATE_HOST }} << 'EOF'
            if ! command -v docker &> /dev/null; then
              echo "📦 Cài đặt Docker..."
              sudo apt update && sudo apt upgrade -y
              sudo apt install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker ubuntu
              newgrp docker
              echo "✅ Docker đã được cài đặt thành công!"
            else
              echo "✅ Docker đã có sẵn"
            fi
            docker --version
          EOF

      - name: 🚀 Deploy Docker Container trên EC2 Private qua Public
        run: |
          ssh -tt -i ~/.ssh/aws_public_key.pem \
            -o ProxyCommand="ssh -i ~/.ssh/aws_public_key.pem -W %h:%p ubuntu@${{ secrets.AWS_PUBLIC_HOST }}" \
            ubuntu@${{ secrets.AWS_PRIVATE_HOST }} << 'EOF'
            echo "🚀 Đăng nhập vào GHCR"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "📥 Pull image mới nhất từ GHCR"
            docker pull ghcr.io/${{ env.REPO_NAME }}/ocr_cargo_box_api:latest || { echo "❌ Không thể pull image"; exit 1; }
            echo "🛑 Dừng & xóa container cũ nếu có"
            docker stop ocr_api_private || true
            docker rm ocr_api_private || true
            echo "🚀 Chạy container mới"
            docker run -d --restart=always -p 8000:8000 --name ocr_api_private ghcr.io/${{ env.REPO_NAME }}/ocr_cargo_box_api:latest
            echo "✅ Kiểm tra container đang chạy"
            docker ps -a
          EOF
