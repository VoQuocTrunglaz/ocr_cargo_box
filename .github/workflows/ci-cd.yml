name: OCR API CI/CD

on:
  push:
    branches:
      - main

jobs:
  pre_build:
    name: 📌 Chuẩn bị môi trường
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Lấy code từ GitHub
        uses: actions/checkout@v4

      - name: 🔧 Thiết lập môi trường Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

  build:
    name: 🏗️ Build & Push Docker Image lên GHCR
    needs: pre_build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Lấy code từ GitHub
        uses: actions/checkout@v4

      - name: 🔠 Chuyển đổi tên repository thành chữ thường
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🔑 Đăng nhập GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 🏗️ Build Docker Image
        run: |
          docker build -t ghcr.io/${{ env.REPO_NAME }}/ocr_cargo_box_api:latest .

      - name: 📤 Push Docker Image lên GHCR
        run: |
          docker push ghcr.io/${{ env.REPO_NAME }}/ocr_cargo_box_api:latest

  deploy_public:
    name: 🚀 Triển khai lên EC2 Public
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Thiết lập SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_PUBLIC_KEY }}" > ~/.ssh/aws_public_key.pem
          chmod 600 ~/.ssh/aws_public_key.pem
          ssh-keyscan -H ${{ secrets.AWS_PUBLIC_HOST }} >> ~/.ssh/known_hosts

      - name: 🔠 Chuyển đổi tên repository thành chữ thường
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        
      - name: 🛠️ Cài đặt Docker trên EC2 Public
        run: |
          ssh -i ~/.ssh/aws_public_key.pem ubuntu@${{ secrets.AWS_PUBLIC_HOST }} << 'EOF'
            sudo apt update && sudo apt upgrade -y
            sudo apt install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker
            sudo usermod -aG docker ubuntu
            newgrp docker
            echo "✅ Docker đã được cài đặt thành công!"
          EOF

      - name: 🚀 Deploy Docker Container trên EC2 Public
        run: |
          ssh -i ~/.ssh/aws_public_key.pem ubuntu@${{ secrets.AWS_PUBLIC_HOST }} << 'EOF'
            echo "🚀 Đăng nhập vào GHCR"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📥 Pull image mới nhất từ GHCR"
            docker pull ghcr.io/${{ env.REPO_NAME }}/ocr_cargo_box_api:latest
            
            echo "🛑 Dừng & xóa container cũ nếu có"
            docker stop ocr_api_public || true
            docker rm ocr_api_public || true
            
            echo "🚀 Chạy container mới"
            docker run -d --restart=always -p 80:8501 --name ocr_api_public ghcr.io/${{ env.REPO_NAME }}/ocr_cargo_box_api:latest
            
            echo "✅ Kiểm tra container đang chạy"
            docker ps
          EOF

  deploy_private:
    name: 🚀 Triển khai lên EC2 Private qua EC2 Public
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Thiết lập SSH key cho cả Public và Private
        run: |
          mkdir -p ~/.ssh
          # Key cho EC2 Public
          echo "${{ secrets.AWS_PUBLIC_KEY }}" > ~/.ssh/aws_public_key.pem
          chmod 600 ~/.ssh/aws_public_key.pem
          # Key cho EC2 Private
          echo "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/aws_private_key.pem
          chmod 600 ~/.ssh/aws_private_key.pem
          # Thêm host vào known_hosts
          ssh-keyscan -H ${{ secrets.AWS_PUBLIC_HOST }} >> ~/.ssh/known_hosts
          ssh-keyscan -H ${{ secrets.AWS_PRIVATE_HOST }} >> ~/.ssh/known_hosts

      - name: 🔠 Chuyển đổi tên repository thành chữ thường
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🛠️ Cài đặt Docker trên EC2 Private qua Public
        run: |
          ssh -i ~/.ssh/aws_public_key.pem -o ProxyCommand="ssh -i ~/.ssh/aws_public_key.pem -W %h:%p ubuntu@${{ secrets.AWS_PUBLIC_HOST }}" ubuntu@${{ secrets.AWS_PRIVATE_HOST }} << 'EOF'
            sudo apt update && sudo apt upgrade -y
            sudo apt install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker
            sudo usermod -aG docker ubuntu
            newgrp docker
            echo "✅ Docker đã được cài đặt thành công!"
          EOF

      - name: 🚀 Deploy Docker Container trên EC2 Private qua Public
        run: |
          ssh -i ~/.ssh/aws_public_key.pem -o ProxyCommand="ssh -i ~/.ssh/aws_public_key.pem -W %h:%p ubuntu@${{ secrets.AWS_PUBLIC_HOST }}" ubuntu@${{ secrets.AWS_PRIVATE_HOST }} << 'EOF'
            echo "🚀 Đăng nhập vào GHCR"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📥 Pull image mới nhất từ GHCR"
            docker pull ghcr.io/${{ env.REPO_NAME }}/ocr_cargo_box_api:latest
            
            echo "🛑 Dừng & xóa container cũ nếu có"
            docker stop ocr_api_private || true
            docker rm ocr_api_private || true
            
            echo "🚀 Chạy container mới"
            docker run -d --restart=always -p 8000:8000 --name ocr_api_private ghcr.io/${{ env.REPO_NAME }}/ocr_cargo_box_api:latest
            
            echo "✅ Kiểm tra container đang chạy"
            docker ps
          EOF
