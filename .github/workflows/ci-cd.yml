name: OCR Full CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    name: 🏗️ Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      - name: 🔠 Convert repo name to lowercase
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🔑 Login GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 🏗️ Build UI Image
        run: docker build -t ghcr.io/${{ env.REPO_NAME }}/ocr_ui:latest ./app/app_ui

      - name: 🏗️ Build API Image
        run: docker build -t ghcr.io/${{ env.REPO_NAME }}/ocr_api:latest ./app/ocr_private

      - name: 📤 Push UI & API Images
        run: |
          docker push ghcr.io/${{ env.REPO_NAME }}/ocr_ui:latest
          docker push ghcr.io/${{ env.REPO_NAME }}/ocr_api:latest

  deploy_ui:
    name: 🚀 Deploy UI (EC2 Public)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 SSH Key Setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_PUBLIC_KEY }}" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem
          ssh-keyscan -H ${{ secrets.AWS_PUBLIC_HOST }} >> ~/.ssh/known_hosts

      - name: 🔠 Convert repo name to lowercase
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🚀 SSH và triển khai UI
        run: |
          ssh -i ~/.ssh/aws_key.pem ubuntu@${{ secrets.AWS_PUBLIC_HOST }} << EOF
            export REPO_NAME="${{ env.REPO_NAME }}"
            sudo apt update && sudo apt install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/\$REPO_NAME/ocr_ui:latest
            docker stop ocr_ui || true && docker rm ocr_ui || true
            docker run -d --restart=always -p 80:8501 --name ocr_ui ghcr.io/\$REPO_NAME/ocr_ui:latest
          EOF

  deploy_api:
    name: 🔐 Deploy API (EC2 Private)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 SSH Key Setup
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_PRIVATE_KEY }}" > ~/.ssh/aws_key.pem
          chmod 600 ~/.ssh/aws_key.pem
          ssh-keyscan -H ${{ secrets.AWS_PRIVATE_HOST }} >> ~/.ssh/known_hosts

      - name: 🔠 Convert repo name to lowercase
        run: echo "REPO_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: 🛠️ SSH và triển khai API
        run: |
          ssh -i ~/.ssh/aws_key.pem ubuntu@${{ secrets.AWS_PRIVATE_HOST }} << EOF
            export REPO_NAME="${{ env.REPO_NAME }}"
            sudo apt update && sudo apt install -y docker.io
            sudo systemctl enable docker
            sudo systemctl start docker
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/\$REPO_NAME/ocr_api:latest
            docker stop ocr_api || true && docker rm ocr_api || true
            docker run -d --restart=always -p 8000:8000 --name ocr_api ghcr.io/\$REPO_NAME/ocr_api:latest
          EOF
